workflows:
  android-workflow:
    name: Android Workflow
    max_build_duration: 60
    environment:
      flutter: stable
    scripts:
      - name: Gerar plataforma Android
        script: flutter create --platforms=android .
      - name: Atualizar versao do Kotlin
        script: |
          if [ -f "android/settings.gradle" ]; then
            perl -pi -e 's/id "org\.jetbrains\.kotlin\.android" version "[^"]+"/id "org.jetbrains.kotlin.android" version "1.9.24"/g' android/settings.gradle
          fi
          if [ -f "android/build.gradle" ]; then
            perl -pi -e "s/ext\.kotlin_version = .*/ext.kotlin_version = '1.9.24'/g" android/build.gradle
          fi
      - name: Instalar dependencias
        script: flutter pub get
      - name: Gerar icone do app
        script: dart run flutter_launcher_icons
      - name: Build APK
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
