workflows:
  android-workflow:
    name: Android Workflow
    max_build_duration: 60
    environment:
      flutter: stable
      java: 17
    scripts:
      - name: Gerar plataforma Android
        script: flutter create --platforms=android .
      - name: Ajustar dependencias legadas
        script: echo "ext.kotlin_version = '1.9.24'" >> android/build.gradle
      - name: Atualizar pacotes e corrigir bugs
        script: |
          flutter pub get
          flutter pub upgrade
      - name: Gerar icone do app
        script: dart run flutter_launcher_icons
      - name: Build APK
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
