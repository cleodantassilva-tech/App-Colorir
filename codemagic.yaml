workflows:
  android-workflow:
    name: Android Workflow
    max_build_duration: 60
    environment:
      flutter: stable
    scripts:
      - name: Gerar plataforma Android
        script: flutter create --platforms=android .
      - name: Atualizar versao do Kotlin
        script: |
          python3 -c "
          import os, re
          def update_file(path):
              if not os.path.exists(path): return
              with open(path, 'r') as f: text = f.read()
              # Procura e substitui no modelo novo (settings.gradle)
              text = re.sub(r'id\s+[\'\"].*?kotlin\.android[\'\"]\s+version\s+[\'\"].*?[\'\"]', 'id \'org.jetbrains.kotlin.android\' version \'1.9.24\'', text)
              # Procura e substitui no modelo antigo (build.gradle)
              text = re.sub(r'ext\.kotlin_version\s*=\s*[\'\"].*?[\'\"]', 'ext.kotlin_version = \'1.9.24\'', text)
              with open(path, 'w') as f: f.write(text)
          update_file('android/settings.gradle')
          update_file('android/build.gradle')
          "
      - name: Instalar dependencias
        script: flutter pub get
      - name: Gerar icone do app
        script: dart run flutter_launcher_icons
      - name: Build APK
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
