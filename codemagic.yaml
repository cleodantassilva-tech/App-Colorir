workflows:
  android-workflow:
    name: Android Workflow
    max_build_duration: 60
    environment:
      flutter: stable
    scripts:
      - name: Gerar plataforma Android
        script: flutter create --platforms=android .
      - name: Ajustar compileSdk do app
        script: |
          if [ -f android/app/build.gradle.kts ]; then
            sed -i '' 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/' android/app/build.gradle.kts
          elif [ -f android/app/build.gradle ]; then
            sed -i '' 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 36/' android/app/build.gradle
          fi
      - name: Forcar compileSdk em todas as dependencias
        script: |
          if [ -f android/build.gradle.kts ]; then
            cat >> android/build.gradle.kts << 'GRADLE_EOF'

          subprojects {
              afterEvaluate {
                  extensions.findByType(com.android.build.gradle.BaseExtension::class.java)?.let { androidExt ->
                      androidExt.compileSdkVersion(36)
                  }
              }
          }
          GRADLE_EOF
          elif [ -f android/build.gradle ]; then
            cat >> android/build.gradle << 'GRADLE_EOF'

          subprojects {
              afterEvaluate { proj ->
                  if (proj.hasProperty("android")) {
                      proj.android {
                          compileSdkVersion 36
                      }
                  }
              }
          }
          GRADLE_EOF
          fi
      - name: Instalar dependencias
        script: flutter pub get
      - name: Build APK
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
