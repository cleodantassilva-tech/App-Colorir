workflows:
  android-workflow:
    name: Android Workflow
    max_build_duration: 60
    environment:
      flutter: stable
      java: 17
    scripts:
      - name: Gerar plataforma Android
        script: flutter create --platforms=android .
      - name: Instalar dependencias
        script: flutter pub get
      - name: Ajustar Versao do Android
        script: |
          python3 -c "
          import os
          arquivos = ['android/app/build.gradle', 'android/app/build.gradle.kts']
          for f in arquivos:
              if os.path.exists(f):
                  texto = open(f, 'r').read()
                  texto = texto.replace('flutter.compileSdkVersion', '34')
                  texto = texto.replace('flutter.targetSdkVersion', '34')
                  open(f, 'w').write(texto)
          "
      - name: Build APK
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
